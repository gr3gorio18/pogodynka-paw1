App\Entity\Location:
    properties:
        name:
            - NotBlank:
                  groups: ['create', 'edit']
            - Length:
                  min: 3
                  max: 255
                  groups: ['create', 'edit']
        country:
            - NotBlank:
                  groups: ['create', 'edit']
        latitude:
            - NotBlank:
                  groups: ['create']
            - Range:
                  min: -90
                  max: 90
                  groups: ['create', 'edit']
        longitude:
            - NotBlank:
                  groups: ['create']
            - Range:
                  min: -180
                  max: 180
                  groups: ['create', 'edit']

App\Entity\Measurement:
    properties:
        date:
            - NotBlank:
                  groups: ['create', 'edit']
        temperature:
            - NotBlank:
                  groups: ['create', 'edit']
            - Range:
                  min: -50
                  max: 50
                  groups: ['create', 'edit']
        cloudiness:
            - NotBlank:
                  groups: ['create', 'edit']
            - Length:
                  min: 3
                  max: 255
                  groups: ['create', 'edit']
        chanceOfRain:
            - NotBlank:
                  groups: ['create']
            - Length:
                  max: 4
                  groups: ['create', 'edit']
        pressure:
            - NotBlank:
                  groups: ['create']
            - Range:
                  min: 850
                  max: 1100
                  groups: ['create', 'edit']
